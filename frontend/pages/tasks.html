<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas - FreelanceFlow</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
    <div class="dashLayout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">

            <!-- LOGO -->
            <div class="sidebarHeader">
                <img src="../css/resources/logos/logo-enlace360.png" alt="Enlace 360 Logo" class="sidebarLogo">
            </div>

            <!-- NAVIGATION -->
            <nav class="sidebarNav">
                <ul class="navList">

                    <li class="navItem ">
                        <a href="dashboard.html" class="navLink">
                            <span class="navIcon">☎</span>
                            <span>Dashboard</span>
                        </a>
                    </li>

                    <li class="navItem">
                        <a href="clients.html" class="navLink">
                            <span class="navIcon">◔</span>
                            <span>Clientes</span>
                        </a>
                    </li>

                    <li class="navItem">
                        <a href="projects.html" class="navLink">
                            <span class="navIcon">⌂</span>
                            <span>Proyectos</span>
                        </a>
                    </li>

                    <li class="navItem active">
                        <a href="tasks.html" class="navLink">
                            <span class="navIcon">✓</span>
                            <span>Tareas</span>
                        </a>
                    </li>

                </ul>
            </nav>

            <!-- FOOTER -->
            <div class="sidebarFooter">
                <button class="logoutBtn" id="logoutBtn">
                    Cerrar sesión
                </button>
            </div>

        </aside>

        <!-- Main Content Area -->
        <main class="mainContent">
            <!-- Top Navbar -->
            <header class="topbar">
                <div class="topbarLeft">
                    <button class="btn mobileMenuBtn" id="mobileMenuBtn">
                        <span class="menuIcon">☰</span>
                    </button>
                    <h1 class="pageTitle">Listado de Tareas</h1>
                </div>
                <div class="topbarRight">
                    <button class="btn btnPrimary" id="newTaskBtn">+ Añadir Tarea</button>
                </div>
            </header>

            <!-- Content -->
            <div class="contentWrapper">
                <div class="dashboardGrid">
                    <!-- Columna: Pendientes -->
                    <section class="card">
                        <div class="cardHeader">
                            <h3 class="cardTitle">Pendientes</h3>
                            <span class="badge badgeNeutral" id="pendingCount">0</span>
                        </div>
                        <ul class="taskList" id="pendingTasksList">
                            <!-- Datos cargados dinámicamente -->
                        </ul>
                    </section>

                    <!-- Columna: En Progreso -->
                    <section class="card">
                        <div class="cardHeader">
                            <h3 class="cardTitle">En Progreso</h3>
                            <span class="badge badgeSuccess" id="progressCount">0</span>
                        </div>
                        <ul class="taskList" id="progressTasksList">
                            <!-- Datos cargados dinámicamente -->
                        </ul>
                    </section>
                </div>

                <!-- Sección: Completadas -->
                <div style="margin-top: 1.5rem;">
                    <section class="card">
                        <div class="cardHeader">
                            <h3 class="cardTitle">Completadas</h3>
                            <span class="badge" id="completedCount" style="background-color: rgba(16, 185, 129, 0.1); color: var(--successColor);">0</span>
                        </div>
                        <ul class="taskList" id="completedTasksList">
                            <!-- Datos cargados dinámicamente -->
                        </ul>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal para Tarea -->
    <dialog id="taskModal" class="modal">
        <div class="modalContent">
            <h2 id="taskModalTitle" style="margin-bottom: 1rem;">Nueva Tarea</h2>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="formGroup">
                    <label>Título de la Tarea *</label>
                    <input type="text" id="taskTitle" placeholder="Ej: Diseñar wireframes" required>
                </div>
                <div class="formGroup">
                    <label>Descripción</label>
                    <textarea id="taskDescription" placeholder="Detalles adicionales de la tarea..."></textarea>
                </div>
                <div class="modalRow">
                    <div class="formGroup">
                        <label>Estado</label>
                        <select id="taskStatus">
                            <option value="Pendiente">Pendiente</option>
                            <option value="En Progreso">En Progreso</option>
                            <option value="Completada">Completada</option>
                        </select>
                    </div>
                    <div class="formGroup">
                        <label>Fecha Límite</label>
                        <input type="date" id="taskDueDate">
                    </div>
                </div>
                <div class="formGroup">
                    <label>Proyecto Asociado</label>
                    <select id="taskProject">
                        <option value="">Sin proyecto</option>
                        <!-- Proyectos cargados dinámicamente -->
                    </select>
                </div>
                <div class="modalActions">
                    <button type="button" class="btn btnSecondary" id="cancelTaskBtn">Cancelar</button>
                    <button type="submit" class="btn btnPrimary">Guardar</button>
                </div>
            </form>
        </div>
    </dialog>

    <script src="../js/config.js"></script>
    <script src="../js/dashboard.js" defer></script>
    <script src="../js/tasks.js" defer></script>
</body>

</html>
